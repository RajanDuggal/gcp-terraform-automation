name: 'Terraform Destroy Infrastructure'

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown'
        required: true
        default: 'CANCEL'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest

    # Safeguard: Only run if the user typed DESTROY in the prompt
    if: github.event.inputs.confirm_destroy == 'DESTROY'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/250794715777/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-sa@project-f2bce33d-23f5-4831-9b4.iam.gserviceaccount.com'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0
        terraform_wrapper: false

    - name: Terraform Init
      env:
        TF_INPUT: "false"
      run: terraform init

    - name: Terraform Destroy
      env:
        TF_INPUT: "false"
        TF_VAR_project_id: 'project-f2bce33d-23f5-4831-9b4'
        TF_VAR_gcp_region: 'us-east1'
        TF_VAR_environment_prefix: 'accenture-prep'
      run: terraform destroy -auto-approve -no-color
